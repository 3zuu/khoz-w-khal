<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,8);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function begin(){const sub=D[G.c].subs[G.s],all=sub.items,n=G.mode==='duo'?2:1,N=G.N;if(all.length<N)return toast(tr('needN',N));G.M=null;G.one=undefined;

function toggleM(i){if(G.ph<2)return vetoPick(i);if(G.gone.has(i))return;if(!G.M.has(i)&&G.M.size>=G.K)return toast(tr('onlyK',G.K));G.M.has(i)?G.M.delete(i):G.M.add(i);beep(600,.05);document.querySelectorAll('#grid .card').forEach((e,j)=>e.classList.toggle('sel',G.M.has(j)));$('#mc').textContent=G.M.size;$('#ok').disabled=G.M.size!=G.K}
function compat(){if(G.pl.length<2)return null;let ag=0,dg=0;const m=new Map(G.pl[1].map(x=>[x.id,x]));G.pl[0].forEach(x=>{const y=m.get(x.id);if(!y||x.st<2||y.st<2)return;x.st==y.st?ag++:dg++});dg+=G.vsig||0;const n=ag+dg;return n>=2?{p:Math.round(100*ag/n),n}:null}

T(location.host||'khoz',W/2,H-90,'900 32px Cairo','#ffffff99',900);
